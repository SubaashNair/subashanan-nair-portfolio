[project]
name = "observatory-analysis"
version = "0.1.0"
description = "Offline pipelines that produce the portfolio's published study results."
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.1,<3",
  "scipy>=1.14,<2",
  "scikit-learn>=1.6,<2",
  "networkx==3.7",
  "osmium==4.3.1",
  "pyarrow==26.0.0",
  "rasterio==1.5.2",
  "shapely==2.2.0",
]

[dependency-groups]
dev = ["pytest>=8.3"]
chronos = ["chronos-forecasting==2.3.2", "torch>=2.4,<3"]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::sklearn.exceptions.ConvergenceWarning"]
